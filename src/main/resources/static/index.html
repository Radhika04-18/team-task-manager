<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Task Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #343a40; margin-bottom: 25px; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background-color: #0056b3; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #dee2e6; }
        p { font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Team Task Manager</h1>
    <p>Please Login to Continue</p>
    <form action="/api/users/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
    </form>
    <hr>
    <p>Btech Project by Radhika</p>
</div>

</body>
