<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Task Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #343a40; margin-bottom: 25px; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background-color: #0056b3; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #dee2e6; }
        p { font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>

<div class="container" style="width: 600px;">
    <h1>Team Task Manager</h1>
    
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h3>Add New Task</h3>
        <input type="text" id="taskTitle" placeholder="Task Title">
        <input type="text" id="memberName" placeholder="Member Name">
        <button onclick="addTask()" class="btn">Add Task</button>
    </div>

    <hr>

    <h3>Pending Tasks</h3>
    <div id="taskList">
        <p>Loading tasks...</p>
    </div>
</div>

<script>
    // 1. Task Add karne ka function
    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const member = document.getElementById('memberName').value;

        fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, memberName: member, status: 'PENDING' })
        }).then(() => {
            alert("Task Added!");
            location.reload(); // Refresh to see new task
        });
    }

    // 2. Task List dikhane aur Status change karne ka function
    fetch('/api/tasks')
        .then(res => res.json())
        .then(data => {
            let html = '';
            data.forEach(task => {
                html += `
                    <div style="border: 1px solid #ddd; padding: 10px; margin: 5px; display: flex; justify-content: space-between;">
                        <span><b>${task.title}</b> - ${task.memberName} (${task.status})</span>
                        ${task.status === 'PENDING' ? 
                            `<button onclick="completeTask(${task.id})" style="background:green; color:white; border:none; border-radius:3px; cursor:pointer;">Complete</button>` 
                            : '✅'}
                    </div>`;
            });
            document.getElementById('taskList').innerHTML = html || "No tasks found.";
        });

    function completeTask(id) {
        fetch(`/api/tasks/${id}/complete`, { method: 'PUT' })
            .then(() => location.reload());
    }
</script>

</body>
